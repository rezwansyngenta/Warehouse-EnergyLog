<!doctype html><meta charset="utf-8"><title>probe</title><pre id="out">running…</pre>
<script>
const URL_ = prompt('Paste the /exec URL') || '';
const log = (s) => document.getElementById('out').textContent += '\n' + s;
(async () => {
  try { const r = await fetch(URL_ + '?action=probe'); log('GET  ' + JSON.stringify(await r.json())); }
  catch (e) { log('GET  FAIL ' + e); }
  try {
    const r = await fetch(URL_, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'probe', hello:'world' }) });
    log('POST ' + JSON.stringify(await r.json()));
  } catch (e) { log('POST FAIL ' + e); }
})();
</script>
